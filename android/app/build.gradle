apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Public HTTPS endpoint, supplied during a controlled release build.
// No endpoint means verification is disabled. This is NOT a credential.
def billingApiUrl = (project.findProperty('scrollshieldBillingApiUrl') ?: '').toString()

// Firebase Android config is PUBLIC metadata, not a secret. All fields must
// be provided together; absent configuration keeps authentication off.
def firebaseProjectId = (project.findProperty('scrollshieldFirebaseProjectId') ?: '').toString()
def firebaseAppId = (project.findProperty('scrollshieldFirebaseAppId') ?: '').toString()
def firebaseApiKey = (project.findProperty('scrollshieldFirebaseApiKey') ?: '').toString()
def firebaseFields = [firebaseProjectId, firebaseAppId, firebaseApiKey]
if (firebaseFields.any { !it.isEmpty() } && firebaseFields.any { it.isEmpty() }) {
    throw new GradleException('All ScrollShield Firebase public config fields must be set together')
}
if (!firebaseProjectId.isEmpty() && !(firebaseProjectId ==~ /^[a-z0-9-]{4,80}$/)) {
    throw new GradleException('Invalid Firebase project identifier')
}
if (!firebaseAppId.isEmpty() && !(firebaseAppId ==~ /^1:[0-9]+:android:[A-Za-z0-9]+$/)) {
    throw new GradleException('Invalid Firebase Android App ID')
}
if (!firebaseApiKey.isEmpty() && !(firebaseApiKey ==~ /^AIza[A-Za-z0-9_-]{30,60}$/)) {
    throw new GradleException('Invalid public Firebase Web API key format')
}

// Base64 DER SubjectPublicKeyInfo from Cloud KMS getPublicKey. Public, not
// secret. Empty by default: production native Pro can NEVER activate.
def billingEntitlementSpki = (project.findProperty('scrollshieldEntitlementPublicKeyBase64') ?: '').toString()
if (!billingEntitlementSpki.isEmpty() &&
    !(billingEntitlementSpki ==~ /^[A-Za-z0-9+\/=]+$/)) {
    throw new GradleException('scrollshieldEntitlementPublicKeyBase64 must be standard Base64 DER SPKI')
}
if (!billingApiUrl.isEmpty() && !(billingApiUrl ==~ /^https:\/\/[a-zA-Z0-9.-]+$/)) {
    throw new GradleException('scrollshieldBillingApiUrl must be an HTTPS hostname without paths or credentials')
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace = "app.scrollshield.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "app.scrollshield.mobile"
        buildConfigField "String", "SCROLLSHIELD_BILLING_API_URL", "\"" + billingApiUrl + "\""
        buildConfigField "String", "SCROLLSHIELD_ENTITLEMENT_SPKI", "\"" + billingEntitlementSpki + "\""
        buildConfigField "String", "SCROLLSHIELD_FIREBASE_PROJECT_ID", "\"" + firebaseProjectId + "\""
        buildConfigField "String", "SCROLLSHIELD_FIREBASE_APP_ID", "\"" + firebaseAppId + "\""
        buildConfigField "String", "SCROLLSHIELD_FIREBASE_API_KEY", "\"" + firebaseApiKey + "\""
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // EncryptedSharedPreferences for the native blocked-app list.
    // Jetpack Security is in maintenance mode; revisit before adding new usage.
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"
    // Google Play Billing 9.1: real localized subscription offers and
    // read-only purchase observations. Payments remain disabled until secure
    // Play Developer API verification is deployed.
    implementation "com.android.billingclient:billing:9.1.0"
    // Main Firebase Auth module (the legacy -ktx artifact is no longer used).
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-auth"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
