name: Fix Config Durability Guard

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-config-durability-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Repair config durability guard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/check-protection-config-durability.ts';
          const source = fs.readFileSync(file, 'utf8');
          const oldSnapshot = `requirePattern(
            'store',
            /PreviousState[\\s\\S]*previousConfig[\\s\\S]*previousUnavailableApps[\\s\\S]*previousUnavailableActiveApps[\\s\\S]*previousGeneration[\\s\\S]*restorePreviousState/,
            'Candidate config write must snapshot the complete previous durable tuple for rollback.',
          );`;
          const newSnapshot = `requirePattern(
            'store',
            /PreferenceSnapshot[\\s\\S]*hadConfig[\\s\\S]*configJson[\\s\\S]*hadUnavailableApps[\\s\\S]*unavailableJson[\\s\\S]*hadUnavailableActiveApps[\\s\\S]*unavailableActiveJson[\\s\\S]*hadGeneration[\\s\\S]*generation[\\s\\S]*new PreferenceSnapshot\\(preferences\\)[\\s\\S]*restoreSnapshot/,
            'Candidate config write must snapshot the complete previous durable tuple for rollback.',
          );`;
          const oldRollback = `requirePattern(
            'store',
            /if \\(!persisted\\)[\\s\\S]*restorePreviousState[\\s\\S]*rollbackPersisted[\\s\\S]*ProtectionConfigWriteCertaintyPolicy/,
            'Failed candidate write must restore previous tuple and update certainty from rollback result.',
          );`;
          const newRollback = `requirePattern(
            'store',
            /if \\(persisted\\)[\\s\\S]*boolean rollbackPersisted = restoreSnapshot\\(preferences, previous\\)[\\s\\S]*writeStateCertain = ProtectionConfigWriteCertaintyPolicy\\.isCertainAfterWrite\\([\\s\\S]*false,[\\s\\S]*rollbackPersisted/,
            'Failed candidate write must restore previous tuple and update certainty from rollback result.',
          );`;
          if (!source.includes(oldSnapshot) || !source.includes(oldRollback)) {
            console.error('Expected legacy config-durability guard blocks were not found.');
            process.exit(1);
          }
          fs.writeFileSync(file, source.replace(oldSnapshot, newSnapshot).replace(oldRollback, newRollback), 'utf8');
          NODE

      - name: Format patched checker
        run: npx prettier --write scripts/check-protection-config-durability.ts

      - name: Commit guard repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-protection-config-durability.ts
          git commit -m "fix: align config durability guard with snapshot store"
          git push origin HEAD:agent/release-foundation
