name: Format Release Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Validate lockfile
        run: node scripts/check-package-lock-sync.mjs

      - name: Install dependencies
        run: npm ci

      - name: Apply repository Prettier contract
        run: npm run format

      - name: Commit canonical formatting only
        run: |
          if git diff --quiet; then
            echo "Repository is already canonically formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: apply canonical Prettier formatting"
          git push origin HEAD:agent/release-foundation
