name: Fix Anti-Binge Guard

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-antibinge-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Repair order-dependent Anti-Binge guard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/check-android-project.ts';
          const source = fs.readFileSync(file, 'utf8');
          const oldBlock = `requireMatch(
            servicePath,
            service,
            /ProtectionRulePolicy\\.isAntiBingeBlocked[\\s\\S]*ProtectionRulePolicy\\.isAntiBingeWarning/,
            'Native Anti-Binge enforcement must execute the JUnit-tested rule policy.',
          );`;
          const newBlock = `requireMatch(
            servicePath,
            service,
            /ProtectionRulePolicy\\.isAntiBingeBlocked/,
            'Native Anti-Binge blocking must execute the JUnit-tested rule policy.',
          );
          requireMatch(
            servicePath,
            service,
            /ProtectionRulePolicy\\.isAntiBingeWarning/,
            'Native Anti-Binge warning must execute the JUnit-tested rule policy.',
          );`;
          if (!source.includes(oldBlock)) {
            console.error('Expected order-dependent Anti-Binge guard block was not found.');
            process.exit(1);
          }
          fs.writeFileSync(file, source.replace(oldBlock, newBlock), 'utf8');
          NODE

      - name: Commit guard repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-android-project.ts
          git commit -m "fix: make anti-binge source guard order-independent"
          git push origin HEAD:agent/release-foundation
