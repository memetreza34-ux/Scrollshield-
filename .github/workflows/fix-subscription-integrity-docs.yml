name: Fix Subscription Integrity Docs

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-subscription-integrity-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Clarify backend-owned Integrity authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin_path = Path('android/app/src/main/java/app/scrollshield/mobile/ScrollShieldIntegrityPlugin.java')
          plugin = plugin_path.read_text()
          old_plugin = 'Requests a Play Integrity token for a nonce issued by the secure ScrollShield backend.'
          new_plugin = 'Requests a Play Integrity token for a server-issued base64url nonce from the secure ScrollShield backend.'
          if old_plugin not in plugin:
              raise SystemExit('Expected Integrity plugin comment anchor not found.')
          plugin_path.write_text(plugin.replace(old_plugin, new_plugin, 1))

          docs_path = Path('docs/SUBSCRIPTION_ENTITLEMENT_ARCHITECTURE.md')
          docs = docs_path.read_text()
          old_docs = 'Google Play Developer API purchases.subscriptionsv2.get'
          new_docs = 'Google Play Developer API verification via purchases.subscriptionsv2.get'
          if old_docs not in docs:
              raise SystemExit('Expected subscription architecture Developer API anchor not found.')
          docs_path.write_text(docs.replace(old_docs, new_docs, 1))
          PY

      - name: Format Markdown contract
        run: npx prettier --write docs/SUBSCRIPTION_ENTITLEMENT_ARCHITECTURE.md

      - name: Commit integrity documentation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/app/scrollshield/mobile/ScrollShieldIntegrityPlugin.java docs/SUBSCRIPTION_ENTITLEMENT_ARCHITECTURE.md
          git commit -m "docs: clarify backend-owned subscription integrity authority"
          git push origin HEAD:agent/release-foundation
