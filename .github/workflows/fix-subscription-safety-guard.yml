name: Fix Subscription Safety Guard

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-subscription-safety-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Repair subscription safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-subscription-safety.ts')
          source = path.read_text()
          replacements = [
              (
                  "/Abo-Funktionen werden hier bewusst nicht als aktive Einstellungen angeboten/",
                  "/Abo-Funktionen werden hier bewusst\\s+nicht als aktive Einstellungen angeboten/",
              ),
              (
                  "/requiresUserChoice: true[\\s\\S]*selectedActiveAppIds: \\[\\][\\s\\S]*pausedAppIds: \\[\\][\\s\\S]*selection-required/",
                  "/selectedActiveAppIds: \\[\\][\\s\\S]*pausedAppIds: \\[\\][\\s\\S]*requiresUserChoice: true[\\s\\S]*selection-required/",
              ),
              (
                  "/Google Play purchase[\\s\\S]*purchaseToken[\\s\\S]*secure ScrollShield backend[\\s\\S]*Google Play Developer API verification[\\s\\S]*cryptographically verifiable bounded entitlement assertion/i",
                  "/Google Play purchase token[\\s\\S]*secure ScrollShield backend[\\s\\S]*Google Play Developer API purchases\\.subscriptionsv2\\.get[\\s\\S]*signed ES256 bounded entitlement assertion/i",
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit('Expected subscription-safety guard pattern was not found: ' + old)
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Format checker
        run: npx prettier --write scripts/check-subscription-safety.ts

      - name: Commit subscription safety guard repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-subscription-safety.ts
          git commit -m "fix: align subscription safety guard with current contracts"
          git push origin HEAD:agent/release-foundation
