name: Fix Subscription Trust Chain Guard

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-subscription-trust-chain-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Align subscription safety trust-chain guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-subscription-safety.ts')
          source = path.read_text()
          old = "/Google Play purchase token[\\s\\S]*secure ScrollShield backend[\\s\\S]*Google Play Developer API purchases\\.subscriptionsv2\\.get[\\s\\S]*signed ES256 bounded entitlement assertion/i"
          new = "/Google Play purchase token[\\s\\S]*secure ScrollShield backend[\\s\\S]*Google Play Developer API verification via purchases\\.subscriptionsv2\\.get[\\s\\S]*signed ES256 bounded entitlement assertion/i"
          if old not in source:
              raise SystemExit('Expected subscription trust-chain regex was not found.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Format checker
        run: npx prettier --write scripts/check-subscription-safety.ts

      - name: Commit trust-chain guard repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-subscription-safety.ts
          git commit -m "fix: align subscription trust-chain guards"
          git push origin HEAD:agent/release-foundation
