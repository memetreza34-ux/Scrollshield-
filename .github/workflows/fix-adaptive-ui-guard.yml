name: Fix Adaptive UI Guard

on:
  push:
    branches:
      - agent/release-foundation
    paths:
      - .github/workflows/fix-adaptive-ui-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-foundation
          fetch-depth: 0

      - name: Make adaptive disclosure guard formatting-safe
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/check-protection-config.ts';
          const source = fs.readFileSync(file, 'utf8');
          const oldPattern = `/Adaptive Anti-Binge-Reibung[\\s\\S]*pro weiterer Öffnung um 5 Sekunden[\\s\\S]*auf 60 Sekunden begrenzt[\\s\\S]*Notfallfreigaben verwenden weiterhin ihren eigenen Countdown/`;
          const newPattern = `/Adaptive Anti-Binge-Reibung[\\s\\S]*pro\\s+weiterer Öffnung um 5 Sekunden[\\s\\S]*auf\\s+60 Sekunden\\s+begrenzt[\\s\\S]*Notfallfreigaben\\s+verwenden weiterhin ihren eigenen Countdown/`;
          if (!source.includes(oldPattern)) {
            console.error('Expected adaptive disclosure regex was not found.');
            process.exit(1);
          }
          fs.writeFileSync(file, source.replace(oldPattern, newPattern), 'utf8');
          NODE

      - name: Commit guard repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-protection-config.ts
          git commit -m "fix: make adaptive disclosure guard whitespace-tolerant"
          git push origin HEAD:agent/release-foundation
