version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns:
          - '@capacitor/*'
      react-runtime:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vite-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - vite-plugin-pwa
      test-tooling:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - jsdom
          - axe-core
      lint-format:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - prettier

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
